# fly.toml app configuration file for AO Sphere BOS
app = "aosphere"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AOSPHERE_ENV = "production"
  AOSPHERE_PORT = "8080"
  AOSPHERE_DB_PATH = "/var/lib/aosphere/data/aosphere.db"
  AOSPHERE_SEED = "false"
  AOSPHERE_LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "3s"
  path = "/healthz"

[mounts]
  source = "aosphere_data"
  destination = "/var/lib/aosphere/data"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

