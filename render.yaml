services:
  - type: web
    name: aosphere
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    disk:
      name: aosphere-data
      mountPath: /var/lib/aosphere/data
      sizeGB: 10
    envVars:
      - key: AOSPHERE_ENV
        value: production
      - key: AOSPHERE_PORT
        value: 8080
      - key: AOSPHERE_DB_PATH
        value: /var/lib/aosphere/data/aosphere.db
      - key: AOSPHERE_SEED
        value: false
      - key: AOSPHERE_SESSION_SECRET
        generateValue: true
      - key: BACKUP_INTERVAL_HOURS
        value: 6
      - key: BACKUP_PASSPHRASE
        generateValue: true

